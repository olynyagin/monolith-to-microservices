version: "3"
services:
  reverseproxy:
    image: ghcr.io/${GHCR_OWNER}/reverseproxy
    depends_on:
      - backend-user
      - backend-feed
    ports:
      - "8080:8080"
  backend-user:
    image: ghcr.io/${GHCR_OWNER}/udagram-api-user
    environment:
      POSTGRES_USERNAME: $POSTGRES_USERNAME
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_DB: $POSTGRES_DB
      AWS_BUCKET: $AWS_BUCKET
      AWS_REGION: $AWS_REGION
      AWS_PROFILE: $AWS_PROFILE
      JWT_SECRET: $JWT_SECRET
      URL: "http://localhost:8100"
    volumes:
      - $HOME/.aws:/root/.aws
  backend-feed:
    image: ghcr.io/${GHCR_OWNER}/udagram-api-feed
    environment:
      POSTGRES_USERNAME: $POSTGRES_USERNAME
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_DB: $POSTGRES_DB
      AWS_BUCKET: $AWS_BUCKET
      AWS_REGION: $AWS_REGION
      AWS_PROFILE: $AWS_PROFILE
      JWT_SECRET: $JWT_SECRET
      URL: "http://localhost:8100"
    volumes:
      - $HOME/.aws:/root/.aws
  udagram-frontend:
    image: ghcr.io/${GHCR_OWNER}/udagram-frontend
    ports:
      - "8100:80"
